# Configuration for shutdown-on-lan. Restart the service after changing it:
#
#   sudo systemctl restart shutdown-on-lan
#
# See https://github.com/jkmassel/shutdown-on-lan#installation for details on each setting.

# The port to listen on
port_number = 53632

# The addresses of the interfaces to accept connections on. Connections arriving on any other
# interface are closed without being read.
addresses = ["127.0.0.1"]

# The string that shuts this machine down. Change this – the default is public!
secret = "Super Secret String"

# The client addresses allowed to connect, for instance your control system. Empty allows any client.
allowed_sources = []
