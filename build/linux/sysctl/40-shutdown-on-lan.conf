# Keeps shutdown-on-lan's default port out of the range the kernel picks the local ports of outgoing connections
# from (for IPv6 too), so that an outgoing connection can't be using it when the service starts.
#
# The setting is a single list for the whole system, and if several files set it, the one read last wins – so if
# you reserve ports yourself, include 53632 in your list. If you've changed the port in /etc/shutdown-on-lan.toml,
# reserve that one instead.
net.ipv4.ip_local_reserved_ports = 53632
