name: Build

on:
  push:
    tags:
      - '*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      uploadurl: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: ""
          draft: true
          prerelease: false

  windows:
    runs-on: windows-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: .github/commands/build-for-windows.bat
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-windows-installer.msi
          path: build/windows/Product.msi
      - name: Attach Artifact to Release
        id: upload-windows-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{needs.setup.outputs.uploadurl}}
          asset_path: build/windows/Product.msi
          asset_name: shutdown-on-lan-windows-installer.msi
          asset_content_type: application/octet-stream

  mac:
    runs-on: macos-latest
    needs: [setup]
    steps:
      - name: Test
        run: |
          echo ${{ env.UPLOAD_URL }}
          echo "${{ env.UPLOAD_URL }}"
          echo $UPLOAD_URL
          echo "Foo"
          echo ${{needs.setup.outputs.uploadurl}}
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cargo build --release
      - name: Package
        run: |
          cd build/mac
          chmod +x build-installer.sh
          ./build-installer.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdownonlan.pkg
          path: build/mac/shutdownonlan.pkg
      - name: Attach Artifact to Release
        id: upload-mac-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{needs.setup.outputs.uploadurl}}
          asset_path: build/mac/shutdownonlan.pkg
          asset_name: shutdownonlan.pkg
          asset_content_type: application/x-newton-compatible-pkg

  linux:
    needs: [setup]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Build packages
        run: build/linux/build-packages.sh ${{ matrix.arch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-linux-${{ matrix.arch }}
          path: build/linux/dist
      - name: Attach Tarball to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{needs.setup.outputs.uploadurl}}
          asset_path: build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.tar.gz
          asset_name: shutdown-on-lan-linux-${{ matrix.arch }}.tar.gz
          asset_content_type: application/gzip
      - name: Attach .deb to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{needs.setup.outputs.uploadurl}}
          asset_path: build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.deb
          asset_name: shutdown-on-lan-linux-${{ matrix.arch }}.deb
          asset_content_type: application/vnd.debian.binary-package
      - name: Attach .rpm to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{needs.setup.outputs.uploadurl}}
          asset_path: build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.rpm
          asset_name: shutdown-on-lan-linux-${{ matrix.arch }}.rpm
          asset_content_type: application/x-rpm
