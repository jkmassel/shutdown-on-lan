name: Build

on:
  push:
    tags:
      - '*'

# The build jobs run the tests, and with them every dependency's build scripts and proc macros, so they only
# get read access. Only the `release` job – which runs none of the project's code – can attest the artifacts
# and publish them, so a compromised dependency can't replace another platform's installer, or attest its
# replacement.
permissions:
  contents: read

jobs:
  # Every artifact takes its version from Cargo.toml, so a tag that doesn't match it would publish installers
  # labelled with the wrong version – or, for a tag without a version bump, packages that `apt` and `dnf`
  # consider already installed.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches the version in Cargo.toml
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the version in Cargo.toml is $VERSION"
            exit 1
          fi

  windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Build
        shell: pwsh
        run: .github/commands/build-for-windows.ps1
      - name: Name the installer
        shell: bash
        run: cp build/windows/Product.msi shutdown-on-lan-windows-installer.msi
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shutdown-on-lan-windows-installer.msi
          path: shutdown-on-lan-windows-installer.msi

  mac:
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Package
        run: build/mac/build-installer.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shutdownonlan.pkg
          path: build/mac/shutdownonlan.pkg

  linux:
    needs: [version]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Install packaging tools
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
      - name: Build packages
        run: build/linux/build-packages.sh ${{ matrix.arch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shutdown-on-lan-linux-${{ matrix.arch }}
          path: build/linux/dist

  release:
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing and recording build provenance attestations for the release assets
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "" dist/*
