name: Build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""

  windows:
    runs-on: windows-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Build
        shell: pwsh
        run: .github/commands/build-for-windows.ps1
      - name: Name the installer
        shell: bash
        run: cp build/windows/Product.msi shutdown-on-lan-windows-installer.msi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-windows-installer.msi
          path: shutdown-on-lan-windows-installer.msi
      - name: Attach Artifact to Release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" shutdown-on-lan-windows-installer.msi

  mac:
    runs-on: macos-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Package
        run: build/mac/build-installer.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdownonlan.pkg
          path: build/mac/shutdownonlan.pkg
      - name: Attach Artifact to Release
        run: gh release upload "$GITHUB_REF_NAME" build/mac/shutdownonlan.pkg

  linux:
    needs: [setup]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test -- --test-threads 1
      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Build packages
        run: build/linux/build-packages.sh ${{ matrix.arch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-linux-${{ matrix.arch }}
          path: build/linux/dist
      - name: Attach Packages to Release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.tar.gz \
            build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.deb \
            build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.rpm
