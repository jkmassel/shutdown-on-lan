name: CI

on:
  push:
    # `**` rather than `*`, which doesn't match branch names containing a `/`
    branches: [ '**' ]
  # Every base branch, so that stacked pull requests are checked too
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo fmt --check
      - name: Style
        run: rustup component add clippy && cargo clippy

  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose -- --test-threads 1
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Test macOS preferences
      if: runner.os == 'macOS'
      run: sudo .github/commands/test-macos-preferences.sh
    # macOS and Linux store their configuration system-wide, so this needs root. The Windows runner is
    # already privileged enough.
    - name: Smoke test listener
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          python .github/commands/listener-smoke-test.py
        else
          sudo "$(command -v python)" .github/commands/listener-smoke-test.py
        fi

  linux-packages:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Build packages
        run: build/linux/build-packages.sh ${{ matrix.arch }}
      - name: Install the .deb
        run: sudo apt-get install -y ./build/linux/dist/shutdown-on-lan-linux-${{ matrix.arch }}.deb
      - name: Test the installed service
        run: sudo build/linux/test-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: shutdown-on-lan-linux-${{ matrix.arch }}
          path: build/linux/dist

  mac-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build the installer
        run: build/mac/build-installer.sh
      - name: Install the package
        run: sudo installer -pkg build/mac/shutdownonlan.pkg -target /
      - name: Test the installed service
        run: sudo build/mac/test-package.sh
      - name: Service and installer logs
        if: failure()
        run: |
          sudo cat /var/log/shutdownonlan.log /var/log/shutdownonlan.error.log || true
          sudo grep -A3 -i 'shutdownonlan\|postinstall' /var/log/install.log | tail -80 || true
      - uses: actions/upload-artifact@v7
        with:
          name: shutdownonlan.pkg
          path: build/mac/shutdownonlan.pkg

  validate-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Validate Installer
        shell: pwsh
        run: .github/commands/build-for-windows.ps1
      - name: Verify no C runtime DLL dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\shutdown-on-lan.exe
          $deps
          if ($deps -match 'vcruntime|msvcp|api-ms-win-crt') {
            throw "shutdown-on-lan.exe depends on a dynamically-linked C runtime"
          }
      - name: Test Windows service
        shell: pwsh
        run: .github/commands/test-windows-service.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: shutdown-on-lan-windows
          path: build/windows
