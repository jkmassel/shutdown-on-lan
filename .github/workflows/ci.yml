name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo fmt --check
      - name: Style
        run: rustup component add clippy && cargo clippy

  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose -- --test-threads 1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    # Linux stores its configuration in /etc, so this needs root. The other runners are already privileged enough.
    - name: Smoke test listener
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo "$(command -v python)" .github/commands/listener-smoke-test.py
        else
          python .github/commands/listener-smoke-test.py
        fi

  validate-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Validate Installer
        run: .github/commands/build-for-windows.bat
      - name: Test Windows service
        shell: pwsh
        run: .github/commands/test-windows-service.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-windows
          path: build/windows
