name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo fmt --verbose && git status --porcelain
      - name: Style
        run: rustup component add clippy && cargo clippy

  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose -- --test-threads 1

  validate-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Validate Installer
        run: .github/commands/build-for-windows.bat
      - name: Verify no C runtime DLL dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\shutdown-on-lan.exe
          $deps
          if ($deps -match 'vcruntime|msvcp|api-ms-win-crt') {
            throw "shutdown-on-lan.exe depends on a dynamically-linked C runtime"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: shutdown-on-lan-windows
          path: build/windows
